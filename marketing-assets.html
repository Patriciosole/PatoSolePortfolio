        tailwind.config = {

    <style>
        .gallery-intro {
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 0.7px, transparent 0.7px);
            background-size: 18px 18px;
        }

        .email-card {
            min-width: 0;
            border: 1px solid #e2e8f0;
            background: #fff;
            box-shadow: 0 2px 8px #0f172a0a;
            transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
        }

        .email-card:hover {
            transform: translateY(-3px);
            border-color: #94a3b8;
            box-shadow: 0 12px 28px #0f172a14;
        }

        .email-preview {
            display: flex;
            aspect-ratio: 4 / 5;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #f1f5f9;
        }

        .email-preview img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .email-card:focus-visible,
        .modal-close:focus-visible {
            outline: 3px solid #4479ce;
            outline-offset: 3px;
        }

        .email-dialog {
            width: min(1040px, calc(100vw - 32px));
            max-width: none;
            max-height: calc(100dvh - 32px);
            padding: 0;
            overflow: hidden;
            border: 1px solid #ffffff30;
            border-radius: 8px;
            background: #111827;
            color: #fff;
            box-shadow: 0 24px 80px #0008;
        }

        .email-dialog::backdrop {
            background: #020617d9;
            backdrop-filter: blur(4px);
        }

        .modal-toolbar {
            display: flex;
            min-height: 56px;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 8px 12px 8px 20px;
        }

        .modal-caption {
            overflow: hidden;
            color: #e2e8f0;
            font-size: 14px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .modal-close {
            display: inline-flex;
            width: 40px;
            height: 40px;
            flex: 0 0 auto;
            align-items: center;
            justify-content: center;
            border: 1px solid #ffffff35;
            border-radius: 4px;
            background: transparent;
            color: #fff;
            cursor: pointer;
            font-size: 25px;
            line-height: 1;
        }

        .modal-image-wrap {
            display: flex;
            max-height: calc(100dvh - 104px);
            align-items: center;
            justify-content: center;
            padding: 0 16px 16px;
        }

        .modal-image-wrap img {
            display: block;
            max-width: 100%;
            max-height: calc(100dvh - 120px);
            object-fit: contain;
        }

        @media (prefers-reduced-motion: reduce) {
            .email-card {
                transition: none;
            }

            .email-card:hover {
                transform: none;
            }
        }
    </style>
</head>

    <script>
            (() => {
                const imagePaths = [
                    'assets/images/emails/All hands Unicef.png',
                    'assets/images/emails/John Deere Event.png',
                    'assets/images/emails/Lemon cash - mobile.png',
                    'assets/images/emails/Lemon cash.png',
                    'assets/images/emails/Sonar Cloud - mobile.png',
                    'assets/images/emails/Sonar Cloud.png',
                    'assets/images/emails/Viola - Car dealer.png',
                    'assets/images/emails/hickies emails/Hikies - Amazon.jpg',
                    'assets/images/emails/hickies emails/Hikies - Corporate Gifting.jpg',
                    'assets/images/emails/hickies emails/Hikies - Fall Sale.gif',
                    'assets/images/emails/hickies emails/Hikies - Labor Day.jpg',
                    'assets/images/emails/hickies emails/Hikies - Nothing in Your Way.jpg',
                    'assets/images/emails/hickies emails/Hikies - Summer Sale.jpg',
                    'assets/images/emails/hickies emails/Hikies - Take a break.jpg',
                    'assets/images/emails/hickies emails/Hikies - Welcome.jpg'
                ];

                const gallery = document.getElementById('email-gallery');
                const dialog = document.getElementById('email-dialog');
                const modalImage = document.getElementById('modal-image');
                const modalCaption = document.getElementById('modal-caption');

                imagePaths.forEach((src) => {
                    const filename = src.split('/').pop();
                    const displayName = filename.replace(/\.[^.]+$/, '');
                    const card = document.createElement('button');
                    const preview = document.createElement('span');
                    const image = document.createElement('img');
                    const label = document.createElement('span');

                    card.type = 'button';
                    card.className = 'email-card block w-full overflow-hidden rounded-md text-left';
                    card.setAttribute('aria-label', `View ${displayName}`);
                    preview.className = 'email-preview';
                    image.src = src;
                    image.alt = '';
                    image.loading = 'lazy';
                    image.decoding = 'async';
                    label.className = 'block overflow-hidden text-ellipsis whitespace-nowrap px-4 py-3 text-sm font-semibold text-slate-700';
                    label.textContent = displayName;

                    preview.append(image);
                    card.append(preview, label);
                    card.addEventListener('click', () => {
                        modalImage.src = src;
                        modalImage.alt = `Email campaign design: ${displayName}`;
                        modalCaption.textContent = displayName;
                        dialog.showModal();
                    });
                    gallery.append(card);
                });

                document.getElementById('modal-close').addEventListener('click', () => dialog.close());
                dialog.addEventListener('click', (event) => {
                    if (event.target === dialog) dialog.close();
                });
                dialog.addEventListener('close', () => {
                    modalImage.removeAttribute('src');
                });
            })();
    </script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
